[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ff"
version = "0.1.0"
description = "Command-line tool for managing a Sleeper dynasty fantasy football league: rosters, trade values, lineup optimizer, draft board, and waivers."
authors = [{ name = "Philippos Savvides" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pydantic>=2,<3",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.scripts]
ff = "ff.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gate suite excludes `live` by default; run `pytest -m live` to hit real APIs.
addopts = "-q -m 'not live'"
# Gate tests are deterministic and offline. Anything hitting the network is
# marked `live` and excluded by default; run with `-m live` to opt in.
markers = [
    "live: hits real Sleeper/FantasyCalc APIs (excluded from the gate suite)",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E402"]

[tool.mypy]
python_version = "3.9"
packages = ["ff"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
show_error_codes = true
